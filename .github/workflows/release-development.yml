name: Release (Development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    uses: ./.github/workflows/package-release.yml
    with:
      prerelease: true
    secrets:
      tizen-author-p12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
