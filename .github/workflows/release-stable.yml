# This workflow builds a Docker image from the repository, pushes it to GitHub Container Registry, and then triggers a second job to extract an artifact and create a GitHub release.
name: Release (Stable)
# Configure this workflow to be triggered manually from the GitHub Actions tab for the `master` branch.
on:
  workflow_dispatch:
# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ github.sha }}
    # This job checks out the code, logs into GitHub Container Registry, builds the Docker image with metadata, pushes it to the registry, and triggers the next workflow via repository dispatch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The ForceGM variant is the same tree with one metadata line injected at
      # packaging time. FORCE_GAME_MODE is declared late in the Dockerfile, after
      # the SDK downloads, so this build reuses every expensive cached layer from
      # the one above rather than fetching the toolchains again.
      - name: Build and push Docker image (ForceGM variant)
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          build-args: FORCE_GAME_MODE=1
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:forcegm
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  run-and-upload-release:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
      packages: read
      actions: write
    # This job depends on the completion of the build-and-push-image job. It checks out the repository, extracts version info, extracts build artifacts from the Docker image, and creates a new GitHub release with the extracted files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will run the container.
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extracts the version number from the config.xml file to use in tagging and release.
      - name: Extract version number
        run: |
          VERSION=$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # Sets the full Docker image tag using the output from the 'build-and-push-image' job.
      - name: Set up image tags
        run: |
          echo "IMAGE_TAG=${{ needs.build-and-push-image.outputs.image_tag }}" >> $GITHUB_ENV
          echo "IMAGE_TAG_FORCEGM=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:forcegm" >> $GITHUB_ENV
      # Runs both containers in detached mode to extract the build artifacts.
      - name: Run Docker containers
        run: |
          docker run -d --name temp_container $IMAGE_TAG
          docker run -d --name temp_container_forcegm $IMAGE_TAG_FORCEGM
      # Copies both widgets from the containers. The build names them after the
      # version declared in config.xml, which was extracted into VERSION above.
      - name: Copy artifacts from Docker containers
        run: |
          docker cp "temp_container:/home/moonlight/Moonlight-v${VERSION}-samirmartins.wgt" .
          docker cp "temp_container_forcegm:/home/moonlight/Moonlight-v${VERSION}-samirmartins-ForceGM.wgt" .
      # Stops and removes the temporary Docker containers to clean up resources.
      - name: Stop and remove Docker containers
        run: |
          docker stop temp_container temp_container_forcegm
          docker rm temp_container temp_container_forcegm
      # Creates a new GitHub release using the extracted version and includes a detailed description.
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          body: |
            # Moonlight Tizen v${{ env.VERSION }}

            - Choose one of the two variants from the release assets. They are built from the same code and differ only in one line of widget metadata:
              - `Moonlight-v${{ env.VERSION }}-samirmartins-ForceGM.wgt` — asks the TV firmware to put the panel into Game Mode. **Leave the in-app Game Mode switch off when using it.**
              - `Moonlight-v${{ env.VERSION }}-samirmartins.wgt` — no Game Mode metadata. Use this one if the variant above misbehaves on your model or firmware.
            - Both share the same application ID, so installing one replaces the other and keeps your saved settings.
            - Follow one of the [installation methods](https://github.com/brightcraft/moonlight-tizen/wiki/Installation-Guide) documented in the upstream wiki to install the application on your TV.

            ## What's Changed:

            - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md).

            ## Credits:

            Almost all of this application comes from [brightcraft/moonlight-tizen](https://github.com/brightcraft/moonlight-tizen). If you would like to support that work financially, you can do so on [brightcraft's Patreon](https://www.patreon.com/cw/BrightCraft/membership).
          draft: false
          prerelease: false
      # Uploads both widgets as release assets in the newly created GitHub release.
      - name: Upload the widget file to GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Moonlight-v${{ env.VERSION }}-samirmartins.wgt
          asset_name: Moonlight-v${{ env.VERSION }}-samirmartins.wgt
          asset_content_type: application/octet-stream
      - name: Upload the ForceGM widget file to GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Moonlight-v${{ env.VERSION }}-samirmartins-ForceGM.wgt
          asset_name: Moonlight-v${{ env.VERSION }}-samirmartins-ForceGM.wgt
          asset_content_type: application/octet-stream
